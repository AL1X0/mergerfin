name: Bug Report
description: Report a bug or unexpected behavior in the MergerFin Jellyfin plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please provide as much detail as possible to help reproduce it.
  - type: input
    id: mergerfin_version
    attributes:
      label: MergerFin Plugin Version
      description: Installed plugin version shown in Dashboard → Plugins
      placeholder: e.g. 0.1.16.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Jellyfin Client
      description: Which client and version were you using?
      placeholder: e.g. jellyfin-web 12.4.0, Swiftfin, Infuse, Kodi
    validations:
      required: true
  - type: input
    id: jellyfin_version
    attributes:
      label: Local & Remote Jellyfin Version(s)
      description: Version(s) of your local and remote Jellyfin servers
      placeholder: e.g. Local 12.4.0, Remote 12.4.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What Happened & Steps to Reproduce
      description: Describe the expected behavior, actual behavior, and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant Jellyfin server logs mentioning MergerFin (remember to redact API keys/tokens).
      render: shell
