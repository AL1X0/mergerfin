name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json and plugin/meta.json
        run: |
          jq empty manifest.json
          jq empty plugin/meta.json
          manifest_ver=$(jq -r '.[0].versions[0].version' manifest.json)
          meta_ver=$(jq -r '.version' plugin/meta.json)
          echo "manifest.json latest version: $manifest_ver"
          echo "plugin/meta.json version: $meta_ver"
          test "$manifest_ver" = "$meta_ver"
